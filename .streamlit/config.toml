# Dark by design: the UI commits to a deep-forest ground with warm off-white
# text and a brass accent. Colours mirror the tokens in app.py's stylesheet.
[theme]
base = "dark"
primaryColor = "#3FBF7F"
backgroundColor = "#071A13"
secondaryBackgroundColor = "#0C2419"
textColor = "#EDF3EE"

[server]
headless = true
# Streamlit's default watcher walks every installed package on startup, which
# with transformers floods the log with probes for optional deps and slows
# boot. Use "auto" while actively editing app.py.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
